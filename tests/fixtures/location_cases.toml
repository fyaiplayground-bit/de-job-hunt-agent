# Golden cases for the US-only location check (fit-scoring rules v5, decision #51). Each case is
# a job's place names (board location first, then the brief's places and remote regions) and
# where the job is: "us" (keep), "outside_us" (skip) or "unclear" (keep). Most come from real
# postings in the database; a few test words that could fool the rule. Any miss rejects a
# proposal (agents.evaluate_fit_rules).

# ---- outside the US: skip
[[cases]]
places = ["Warsaw", "Warsaw, Poland"]
where = "outside_us"

[[cases]]
places = ["Stockholm (hybrid)", "Stockholm", "London"]
where = "outside_us"

[[cases]]
places = ["São Paulo, São Paulo, Brazil", "São Paulo, Brazil"]
where = "outside_us"

[[cases]]
places = ["Remote - Canada", "Remote (Canada)", "Canada"]
where = "outside_us"

[[cases]]
places = ["Toronto, Canada", "Toronto, ON"]
where = "outside_us"

[[cases]]
places = ["Vancouver, BC", "Vancouver"]
where = "outside_us"

[[cases]]
places = ["Remote - India"]
where = "outside_us"

[[cases]]
places = ["ASSAGO, Lombardia(MI), it (hybrid)", "Assago (MI), Italy"]
where = "outside_us"

[[cases]]
places = ["CA-Toronto-York St 24/25"]
where = "outside_us"

[[cases]]
places = ["San Jose, Costa Rica", "San Jose, Costa Rica"]
where = "outside_us"

[[cases]]
places = ["Remote", "EMEA"]
where = "outside_us"

[[cases]]
places = ["London, United Kingdom"]
where = "outside_us"

[[cases]]
places = ["Remote", "Latin America"]
where = "outside_us"

[[cases]]
places = ["Brisbane, QLD, au (hybrid)"]
where = "outside_us"

[[cases]]
places = ["Milano, IT, 20123"]
where = "outside_us"

# A geocoding mix-up seen on 18 Microsoft postings: Redmond is in Washington. Kept.
[[cases]]
places = ["Redmond, Australia (hybrid)"]
where = "unclear"

