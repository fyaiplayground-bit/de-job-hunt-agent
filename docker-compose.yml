# Local services for de-job-hunt-agent.
# Start: docker compose up -d   ·   Stop: docker compose down (data is kept in the pgdata volume)
# Values come from .env (copy .env.example); compose stops with an error if a required one is missing.
#
# Airflow (decision #46) is in the "airflow" profile, so the commands above leave it alone:
#   start: docker compose --profile airflow up -d --build      web page: http://127.0.0.1:8080
#   stop:  docker compose stop airflow-apiserver airflow-scheduler airflow-dag-processor
# (Not "--profile airflow down": that would also remove the Postgres container.)

name: de-job-hunt-agent

x-airflow: &airflow
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile
  image: jobhunt-airflow:3.3.2
  profiles: ["airflow"]
  # Started when needed, not after every reboot, until it takes over the daily run (step 4.5).
  restart: "no"
  depends_on:
    airflow-init:
      condition: service_completed_successfully
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    # Airflow's own records go in a separate "airflow" database on the same Postgres server.
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow
    AIRFLOW__CORE__DAGS_FOLDER: /opt/jobhunt/dags
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: America/Los_Angeles
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    # Shared by every Airflow part so they trust each other; random values kept in .env.
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?set AIRFLOW_JWT_SECRET in .env}
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_SECRET_KEY:?set AIRFLOW_SECRET_KEY in .env}
    # No login page: the web page is reachable only from this computer (127.0.0.1 below).
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
    AIRFLOW__API__EXPOSE_CONFIG: "false"
    # The pipeline's steps read the rest of their settings from the mounted .env; inside Docker
    # the database is the "postgres" service, not 127.0.0.1.
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    # The backup runs pg_dump from here over the network: there is no Docker inside Docker.
    PG_TOOLS_DIR: /usr/lib/postgresql/17/bin
    # dbt's working files stay in the container, apart from the laptop's dbt/target.
    DBT_TARGET_PATH: /opt/airflow/dbt/target
    DBT_LOG_PATH: /opt/airflow/dbt/logs
  volumes:
    - .:/opt/jobhunt
    # The backup profile's AWS keys, read-only (decision #44).
    - ${USERPROFILE:?}/.aws:/home/airflow/.aws:ro
    - airflow-logs:/opt/airflow/logs

services:
  postgres:
    image: postgres:17
    container_name: jobhunt-postgres
    restart: unless-stopped
    environment:
      # Only the database settings go into the container, not the whole .env (which also holds API keys).
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      # Bound to 127.0.0.1 so only this computer can connect, not other devices on the network.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # "healthy" means Postgres accepts connections, not just that the process started.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  airflow-init:
    <<: *airflow
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *airflow-env
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      CONNECTION_CHECK_MAX_COUNT: "0"  # the airflow database may not exist yet
    command: ["bash", "-c", "python /opt/jobhunt/docker/airflow/create_airflow_db.py && airflow db migrate"]

  airflow-apiserver:
    <<: *airflow
    command: api-server
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  airflow-scheduler:
    <<: *airflow
    command: scheduler

  airflow-dag-processor:
    <<: *airflow
    command: dag-processor

volumes:
  pgdata:
  airflow-logs:
