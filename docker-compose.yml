# Local services for de-job-hunt-agent.
# Start: docker compose up -d   ·   Stop: docker compose down (data is kept in the pgdata volume)
# Values come from .env (copy .env.example); compose stops with an error if a required one is missing.

name: de-job-hunt-agent

services:
  postgres:
    image: postgres:17
    container_name: jobhunt-postgres
    restart: unless-stopped
    environment:
      # Only the database settings go into the container, not the whole .env (which also holds API keys).
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      # Bound to 127.0.0.1 so only this computer can connect, not other devices on the network.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # "healthy" means Postgres accepts connections, not just that the process started.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  pgdata:
