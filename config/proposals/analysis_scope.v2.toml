# Which postings jd-analysis spends money on (decision #31). Code applies these filters before
# any LLM call, so the model only reads postings worth scoring. Rules as data: change them
# through the loop (propose, show how many postings move, FL approves, bump version, record in
# DECISIONS.md). Location and pay are not filtered here; fit-scoring checks them against the
# Applicant Profile.

version = 2

# Title looks like data engineering. Same pattern as DE_TITLE in pipeline/daily.py (a test keeps
# them equal), case-insensitive, Postgres regex syntax.
title_include = 'data engineer|analytics engineer|data platform|etl\M|data infrastructure|data pipeline'

# Levels FL is not targeting yet, and internships.
title_exclude = '\m(staff|principal|lead|manager|director|head|vp|intern|internship)\M'

# Still open: seen on its board within this many days.
open_within_days = 3

# Gate triage tiers an agent may read (decision #22). review and block never reach an LLM.
triage_allowed = ["clean", "benign"]

# freehire marks reposted or old postings as stale (payload reality.class); skip them.
skip_freehire_stale = true

# v2 (proposal, decision #32): freehire sometimes gives only a cut-off snippet (a company blurb
# ending in "…"), which yields an empty brief. 56 of 442 in-scope postings had under 1,000
# characters of cleaned text, all from freehire.
min_text_chars = 1000
