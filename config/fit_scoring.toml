# v5 (adopted 2026-11-15, decision #51): a US-only location check for the test phase. FL's call
# after the first real tailoring run picked Asana in Warsaw: ignore salary and location while
# testing, except skip jobs outside the US. Onsite anywhere in the US is fine. Only the location
# changes from v4.

# How a job brief is scored against the candidate profile (decision #35). Code applies these;
# no LLM is involved, so the same brief, profile and rules always give the same score. Rules as
# data: change them through the loop (propose, show what moves, FL approves, bump version,
# record in DECISIONS.md), then `uv run python -m agents.fit_scoring run` rescores everything.

version = 5

# score = must_weight x must-have coverage + nice_weight x nice-to-have coverage + archetype
# adjustment, kept within 0..100. Coverage is the share of skills the profile covers.
must_weight = 70
nice_weight = 20
core_weight = 2          # a core must-have counts this many times in must-have coverage

[skill_matching]
# How much of a posting's exact phrase must name a skill for it to count. alternatives_only: the
# whole phrase, or one side of an "or". "Java & Python" no longer credits Java to someone who has
# only Python, while "Airflow or Dagster" still counts for someone with Airflow.
exact_phrases = "alternatives_only"

[archetype_adjustment]
# v4 (proposed 2026-11-13): FL's target is data engineering, not analytics engineering. AE roles
# stay possible (their decision doesn't change) but rank below pipeline DE roles and lose the
# referral flag unless they score very high. Infra DE no longer penalized: it's still DE.
analytics_engineer = -15
pipeline_de = 5
infra_de = 0

[decision]
apply_bar = 0.5          # apply when must-have coverage reaches this (decision #8)
referral_score = 65      # and look for a referral at or above this score

[dealbreakers]
# A posting may ask for this many more years than the profile has and still be worth applying.
years_tolerance = 1
# "us_only" during the test phase (v5): skip a job only when its places are clearly all outside
# the US; onsite anywhere in the US is fine, and a job with no place or an unclear one is kept.
# "off" = location is shown, never a reason to skip. The big-tech phase will limit it to
# California, Washington and Texas (FL, 2026-11-02).
location_check = "us_only"
salary_floor_check = true   # skip when the posting's top of range is below the profile's floor
sponsorship_check = true    # skip when the profile needs sponsorship and the posting won't give it

# US government security clearance, read from the posting's title and cleaned text. Regular
# expressions, ignoring case. Applied in this order:
#   1. `ignore`: wording that doesn't make it a requirement. Removed from the text first.
#   2. `obtain`: the employer wants someone who can get one. Removed next, so it can't count as
#      `hold` too. Skipped unless the profile has one or can_obtain_security_clearance is true.
#   3. `hold`: the candidate must already have one. Skipped unless has_security_clearance is true.
# A public trust determination is a background check, not a clearance, and doesn't count.
[dealbreakers.clearance]
ignore = [
    '\bU\.S\.',
    '\b(clearance\s*(level\s*)?(requirements?|required)?(\s+to\s+start)?|currently possess)\s*:\s*(ability to obtain\s*)?(no clearance|none|n/?a|public trust)\b',
    '\b(security\s+)?clearance\s*:\s*(?=[^.\n]{0,60}\bobtain\b)',
    '\bpublic trust\b[^.\n;]{0,25}',
    '\bno\s+(active\s+|security\s+)?clearance\b[^.\n;]{0,15}',
    '\b(does not|doesn.t|do not)\s+require\b[^.\n;]{0,30}\bclearance\b',
    '\bclearance\b[^.\n;]{0,15}\bnot\s+(required|needed)\b',
    '\b(active\s+|current\s+)?((secret|top[- ]secret|TS\s*/\s*SCI|security|federal|government)\s+)*(clearance|TS\s*/\s*SCI|top[- ]secret)\b\s*(is\s+|are\s+)?(strongly\s+)?(preferred|desired|a plus|nice to have|a bonus)\b(?!\s+qualif)',
    '\bpreferred qualifications\W{0,6}[^.\n;]{0,25}\bclearance\b',
    '\b(preferred|desired|nice to have)\s*:[^.\n;]{0,40}\bclearance\b',
    '\bsecurity clearance requirements?\b',
    '\bpolygraph protection\b',
    '\bfingerprint clearance\b',
    '\beligibility\s*&\s*clearance\b',
    '\bmany of our positions\b[^.\n;]{0,60}\bclearance\b',
]
obtain = [
    '\b(obtain|obtaining|obtainable|attain|gain)\b[^.\n;]{0,50}\b(clearance|secret|TS\s*/\s*SCI|SCI)\b(\W+(security\s+)?clearance)?',
    '\beligib\w*\b[^.\n;]{0,30}\b(clearance|secret|TS\s*/\s*SCI)\b(\W+(security\s+)?clearance)?',
    '\bclearance[- ]eligib\w*\b',
]
hold = [
    '\bTS\s*/\s*SCI\b',
    '\btop[- ]secret\b',
    '\b(secret|security|government|DoD|DoW|federal|Q|SCI|TS|poly)\s+clearance\b',
    '\bsecret cleared\b',
    '\b(DOE|active)\s+Q\b',
    '\bpolygraph\b',
    '\b(active|current|must have|must hold|must possess|currently possess)\b[^.\n;]{0,30}\b(secret|clearance)\b',
    '\bclearance\s+required\b(?!\s*:)',
    '(?m)^cleared\s',
]

# Where a job is (v5). Read only from its place names: the job board's location field, and the
# places and remote regions the brief read from the posting, never the rest of the posting text.
# Regular expressions, ignoring case except inside (?-i:...). Each place is checked in this order:
#   1. `us`: clearly in the US or open to it (country, state, state code, "Americas").
#   2. `outside_us`: clearly somewhere else (country, region, Canadian province, big foreign city).
#   3. `us_cities`: a well-known US city named without its state ("Seattle", "Bay Area").
# A place that names both a US city and somewhere else ("Boston, Philippines", an aggregator's
# mix-up) contradicts itself and counts as unclear. Cities that exist in other countries too
# ("San Jose" in Costa Rica) are left out of `us_cities`; named alone they're unclear and kept.
# A job is skipped when none of its places is US and at least one is clearly elsewhere. No place,
# or only places nobody recognises ("Remote", "Corp Headquarters"), keeps the job.
[dealbreakers.location]
us = [
    '(?-i:\bUSA?\b)',
    '\bU\.S\.(A\.?)?',
    '\bUnited States\b',
    '(?<!Latin )(?<!South )(?<!Central )\bAmericas?\b',
    '\bNorth\s*(&|and|/)\s*South\s+Americas?\b',
    '\b(Alabama|Alaska|Arizona|Arkansas|California|Colorado|Connecticut|Delaware|Florida|Georgia|Hawaii|Idaho|Illinois|Indiana|Iowa|Kansas|Kentucky|Louisiana|Maine|Maryland|Massachusetts|Michigan|Minnesota|Mississippi|Missouri|Montana|Nebraska|Nevada|New Hampshire|New Jersey|New Mexico|New York|North Carolina|North Dakota|Ohio|Oklahoma|Oregon|Pennsylvania|Rhode Island|South Carolina|South Dakota|Tennessee|Texas|Utah|Vermont|Virginia|Washington|West Virginia|Wisconsin|Wyoming|District of Columbia|Puerto Rico)\b',
    # A two-letter state code after a comma, a space or the start, and before the end, a
    # bracket, a comma or " -": "Austin, TX", "McKinney TX", "IL - Chicago". Not "CA-Toronto".
    '(?-i:(^|,|\s)\s*(AL|AK|AZ|AR|CA|CO|CT|DE|DC|FL|GA|HI|ID|IL|IN|IA|KS|KY|LA|ME|MD|MA|MI|MN|MS|MO|MT|NE|NV|NH|NJ|NM|NY|NC|ND|OH|OK|OR|PA|RI|SC|SD|TN|TX|UT|VT|VA|WA|WV|WI|WY|PR)(?=\s*($|[,;/()]|\s-|\s\d{5})))',
    '(?-i:\bD\.C\.)',
]
outside_us = [
    '\b(Canada|Mexico|Brazil|Argentina|Chile|Colombia|Peru|Uruguay|Costa Rica|Guatemala|Panama|Dominican Republic|Jamaica|United Kingdom|England|Scotland|Wales|Northern Ireland|Ireland|Germany|France|Spain|Portugal|Italy|Netherlands|Belgium|Luxembourg|Switzerland|Austria|Poland|Czech Republic|Czechia|Slovakia|Hungary|Romania|Bulgaria|Serbia|Croatia|Slovenia|Greece|Cyprus|Malta|Sweden|Norway|Denmark|Finland|Iceland|Estonia|Latvia|Lithuania|Ukraine|Turkey|T\u00fcrkiye|Israel|United Arab Emirates|UAE|Saudi Arabia|Qatar|Egypt|Morocco|Nigeria|Kenya|South Africa|India|Pakistan|Bangladesh|Sri Lanka|Nepal|Singapore|Malaysia|Indonesia|Philippines|Thailand|Vietnam|China|Hong Kong|Taiwan|Japan|South Korea|Korea|Australia|New Zealand)\b',
    '(?-i:\bUK\b)',
    '\b(EMEA|APAC|LATAM|Europe|European Union|Latin America|South America|Central America|Asia|Middle East|Africa)\b',
    '\b(Ontario|Quebec|Qu\u00e9bec|British Columbia|Alberta|Manitoba|Saskatchewan|Nova Scotia|New Brunswick|Newfoundland)\b',
    '(?-i:,\s*(ON|QC|BC|AB|MB|SK|NS|NB|NL|PE)\b)',
    '(?-i:\b(NSW|QLD)\b)',
    '\b(Toronto|Vancouver|Montreal|Montr\u00e9al|Ottawa|Calgary|Edmonton|London|Dublin|Edinburgh|Manchester|Berlin|Munich|M\u00fcnchen|Hamburg|Frankfurt|Amsterdam|Rotterdam|Paris|Madrid|Barcelona|Lisbon|Milan|Milano|Rome|Zurich|Z\u00fcrich|Geneva|Vienna|Warsaw|Krakow|Krak\u00f3w|Wroclaw|Wroc\u0142aw|Prague|Budapest|Bucharest|Stockholm|Copenhagen|Oslo|Helsinki|Tallinn|Kyiv|Tel Aviv|Dubai|Bangalore|Bengaluru|Hyderabad|Pune|Mumbai|Delhi|Gurgaon|Gurugram|Noida|Chennai|Tokyo|Seoul|Shanghai|Beijing|Shenzhen|Taipei|Sydney|Melbourne|Brisbane|Adelaide|Auckland|S\u00e3o Paulo|Sao Paulo|Mexico City|Guadalajara|Bogot\u00e1|Bogota|Medell\u00edn|Medellin|Buenos Aires|Santiago|Manila)\b',
]
us_cities = [
    '\b(New York City|NYC|San Francisco|Bay Area|Silicon Valley|Seattle|Austin|Boston|Chicago|Los Angeles|Denver|Atlanta|Dallas|Houston|Miami|Philadelphia|Phoenix|Portland|San Diego|Sunnyvale|Mountain View|Palo Alto|Menlo Park|Cupertino|Santa Clara|Redwood City|Oakland|Redmond|Bellevue|Kirkland|Pittsburgh|Detroit|Minneapolis|Nashville|Charlotte|Raleigh|Durham|Salt Lake City|Las Vegas|Baltimore|Arlington|Tampa|Orlando|Columbus|Cincinnati|Cleveland|Indianapolis|St\.? Louis|Kansas City|Milwaukee|Sacramento|Irvine|Newport Beach|Carlsbad)\b',
    '(?-i:\b(SF|LA)\b)',
]
