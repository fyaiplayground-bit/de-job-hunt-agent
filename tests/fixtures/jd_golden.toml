# Golden set for jd-analysis (decision #32): what a correct brief must contain for 10 real
# postings. Drafted by Claude from each posting's requirements, reviewed by FL.
#
# Only identifiers and expected values live here. The postings are other companies' text and
# the repo is public, so the text stays in the local database; agents.evaluate_prompt reads it
# from there by (source, source_job_id, content_hash).
#
# must_haves: the skills a correct brief lists as must-haves. "A|B" accepts either name; a
#   match is checked against the brief's skill name and its exact phrases, ignoring case.
# archetype: accepted archetypes; [] means not scored (the posting doesn't say enough).
# nice_to_haves: skills named as preferred / a plus, or only in the duties. A correct brief
#   keeps each one (as a nice-to-have); listing it as a must-have counts as promoted.
# work_mode: the expected work mode.
# years_required: accepted values for the overall years asked for; [] means null.

[[case]]
name = "anthropic-data-engineer"
source = "freehire"
source_job_id = "data-engineer-anthropic-mauchik4"
content_hash = "14e3923a250390de1e32d7fc1a078101d5281a58812c56cd2b23832821a9510e"
why = "GTM data platform; years only under preferred; salary and visa sponsorship stated"
must_haves = [
    "SQL", "Python", "Data modeling|data models", "ETL|data pipelines|production pipelines",
    "Orchestration|workflow orchestration|orchestration tooling",
    "Cloud data warehouse|data warehouse", "Entity resolution|record matching|deduplication",
    "CRM|CRM systems|go-to-market data|GTM data",
]
archetype = ["analytics_engineer", "pipeline_de"]
work_mode = "hybrid"
years_required = [5]
nice_to_haves = [
    "Salesforce",
    "LLM|LLMs|LLMs in data pipelines|LLM evaluation",
    "Master data management|MDM|firmographics|company data",
]

