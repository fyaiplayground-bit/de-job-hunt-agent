# PROPOSAL, not adopted until FL approves. Adds Git/GitHub, found checking fit_scoring.v3, and
# a Data lakes family (FL, 2026-11-05: S3 experience counts for "AWS-based data lakes (S3)").
# Shared skill vocabulary for fit-scoring (decision #35): how the names job briefs use map to
# the canonical skill names an Evidence Bank uses. Generic, not about any one candidate: the
# candidate's own spellings are the aliases in their Evidence Bank. Matching ignores case.
# Grow it through the loop: names that match nothing are listed by `agents.fit_scoring
# unmatched`; add a synonym or family member, evaluate, FL approves, bump version.

version = 3

